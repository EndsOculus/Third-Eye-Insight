name: Desktop tests
on:
  push:
    branches: [main, feat/desktop-insight]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync python -m pytest tests -q
      - run: uv run --no-sync ruff check desktop.py desktop_core.py embedding_cache.py extract_chat_data.py metrics.py runtime_config.py --select E9,F63,F7,F82

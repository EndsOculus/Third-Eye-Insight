name: Desktop tests
on:
  push:
    branches: [main, feat/desktop-insight]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync python -m pytest tests -q --ignore=tests/test_desktop.py
      # One Tcl/Tk application lifetime per process, matching the real launcher.
      # Repeated root interpreter teardown/recreation fails in hosted Windows.
      - name: Isolated desktop workflows (all cases, no skips)
        shell: pwsh
        run: |
          $cases = uv run --no-sync python -m pytest tests/test_desktop.py --collect-only -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nodes = @($cases | Where-Object { $_ -match '^tests/test_desktop.py::' })
          if ($nodes.Count -eq 0) { throw "No desktop test cases collected" }
          foreach ($node in $nodes) {
            uv run --no-sync python -m pytest $node -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: uv run --no-sync ruff check database_access.py desktop.py desktop_core.py embedding_cache.py extract_chat_data.py metrics.py runtime_config.py local_process.py generation_assist.py generation_view.py evaluate_generation.py native_payload.py interaction_data.py interaction_v2.py interaction_assist.py interaction_cli.py evaluate_interactions.py --select E9,F63,F7,F82
